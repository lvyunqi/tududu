name: 校验安卓签名密钥

# 一次性用途：用仓库里的 Secret 还原密钥库，确认能正常打开、指纹一致。
# 校验完即删。

on:
  workflow_dispatch:

jobs:
  verify:
    name: 校验
    runs-on: ubuntu-latest
    steps:
      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 还原并校验密钥库
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          EXPECTED: ${{ secrets.ANDROID_KEYSTORE_SHA256 }}
        run: |
          set -euo pipefail

          printf '%s' "$KEYSTORE_B64" | base64 -d > release.jks
          echo "密钥库大小: $(stat -c%s release.jks) 字节"

          ACTUAL=$(keytool -list -v -keystore release.jks \
            -alias "$KEY_ALIAS" -storepass "$STORE_PASS" \
            | grep 'SHA256:' | head -1 | sed 's/.*SHA256: //' | tr -d ':' | tr -d ' ')

          echo "实际指纹: $ACTUAL"
          echo "期望指纹: $EXPECTED"

          if [ "$ACTUAL" = "$EXPECTED" ]; then
            echo "RESULT=指纹一致"
          else
            echo "RESULT=指纹不一致"
            exit 1
          fi

          # 顺带确认密钥口令可用
          keytool -certreq -alias "$KEY_ALIAS" -keystore release.jks \
            -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
            -file /dev/null
          echo "RESULT=密钥口令可用"
