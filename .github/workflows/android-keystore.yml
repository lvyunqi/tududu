name: 生成安卓签名密钥

# 一次性用途：为 Android 打包生成签名密钥库。
# 跑完把产物取走存进仓库 Secrets 之后，这个工作流就应该删掉，
# 留着容易被误触发，一触发就会生成新密钥，导致已安装的包无法覆盖更新。

on:
  workflow_dispatch:

jobs:
  keystore:
    name: 生成密钥库
    runs-on: ubuntu-latest
    steps:
      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 生成密钥库
        run: |
          set -euo pipefail

          STORE_PASS=$(openssl rand -hex 16)
          KEY_PASS="$STORE_PASS"
          ALIAS=tududu

          keytool -genkeypair -v \
            -keystore release.jks \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
            -dname 'CN=Tududu, OU=Mobile, O=Tududu, L=Shenzhen, ST=Guangdong, C=CN'

          base64 -w0 release.jks > keystore.b64
          printf '%s' "$STORE_PASS" > storepass.txt
          printf '%s' "$KEY_PASS" > keypass.txt
          printf '%s' "$ALIAS" > alias.txt

          # 指纹可以公开，用来核对签名一致性
          keytool -list -v -keystore release.jks -storepass "$STORE_PASS" \
            | grep -E 'SHA1:|SHA256:' > fingerprint.txt

          echo "密钥库已生成"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: android-keystore
          path: |
            keystore.b64
            storepass.txt
            keypass.txt
            alias.txt
            fingerprint.txt
          retention-days: 1
          if-no-files-found: error
