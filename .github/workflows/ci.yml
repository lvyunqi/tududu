name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    name: 格式检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装 Rust 1.98
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt
      - name: 检查代码格式
        run: cargo fmt --all -- --check

  clippy:
    name: 静态检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装 Rust 1.98
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy
      - name: 恢复编译缓存
        uses: Swatinem/rust-cache@v2
      - name: 运行 clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: 单元测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装 Rust 1.98
        uses: dtolnay/rust-toolchain@1.98.0
      - name: 恢复编译缓存
        uses: Swatinem/rust-cache@v2
      - name: 运行测试
        run: cargo test --workspace

  build:
    name: 构建静态二进制
    runs-on: ubuntu-latest
    needs: [fmt, clippy, test]
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装 Rust 1.98
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: x86_64-unknown-linux-musl
      - name: 恢复编译缓存
        uses: Swatinem/rust-cache@v2
      - name: 安装 musl 工具链
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: 编译静态二进制
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          AR_x86_64_unknown_linux_musl: ar
        run: cargo build --release --target x86_64-unknown-linux-musl
      - name: 校验产物
        run: |
          file target/x86_64-unknown-linux-musl/release/tududu
          target/x86_64-unknown-linux-musl/release/tududu version
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: tududu-linux-x86_64
          path: target/x86_64-unknown-linux-musl/release/tududu
          if-no-files-found: error

  summary:
    name: 汇总
    runs-on: ubuntu-latest
    needs: [fmt, clippy, test, build]
    if: always()
    steps:
      - name: 写运行摘要
        run: |
          {
            echo "## 流水线结果"
            echo ""
            echo "| 任务 | 结果 |"
            echo "| --- | --- |"
            echo "| 格式检查 | ${{ needs.fmt.result }} |"
            echo "| 静态检查 | ${{ needs.clippy.result }} |"
            echo "| 单元测试 | ${{ needs.test.result }} |"
            echo "| 构建静态二进制 | ${{ needs.build.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
