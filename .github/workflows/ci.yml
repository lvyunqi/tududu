name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    name: 格式检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装 Rust 1.98
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt
      - name: 检查代码格式
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

  clippy:
    name: 静态检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装 Rust 1.98
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy
      - name: 恢复编译缓存
        uses: Swatinem/rust-cache@v2
      - name: 运行 clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: 单元测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装 Rust 1.98
        uses: dtolnay/rust-toolchain@1.98.0
      - name: 恢复编译缓存
        uses: Swatinem/rust-cache@v2
      - name: 运行测试
        run: cargo test --workspace --lib --bins

  build:
    name: 构建静态二进制
    runs-on: ubuntu-latest
    needs: [fmt, clippy, test]
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装 Rust 1.98
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: x86_64-unknown-linux-musl
      - name: 恢复编译缓存
        uses: Swatinem/rust-cache@v2
      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 构建用户端
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: 构建管理后台
        working-directory: admin
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm build

          # 后台挂在 /admin 下，产物里的资源路径必须带这个前缀，
          # 否则打开就是白屏，这类问题在页面上很难看出来
          if ! grep -q '/admin/assets/' dist/index.html; then
            echo "管理后台的产物没有带 /admin 前缀，打开会是白屏"
            cat dist/index.html
            exit 1
          fi
          echo "资源路径正确"
      - name: 安装 musl 工具链
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: 编译静态二进制
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          AR_x86_64_unknown_linux_musl: ar
        run: cargo build --release --target x86_64-unknown-linux-musl
      - name: 校验产物
        run: |
          file target/x86_64-unknown-linux-musl/release/tududu
          target/x86_64-unknown-linux-musl/release/tududu version
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: tududu-linux-x86_64
          path: target/x86_64-unknown-linux-musl/release/tududu
          if-no-files-found: error

  integration:
    name: 集成测试
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: tududu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装 Rust 1.98
        uses: dtolnay/rust-toolchain@1.98.0
      - name: 恢复编译缓存
        uses: Swatinem/rust-cache@v2
      - name: 跑计费与支付测试
        env:
          TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/tududu_test
        run: cargo test --tests -- --test-threads=1
  android:
    name: 安卓打包
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Rust 1.98
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: 恢复编译缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      # runner 镜像本身就带 Android SDK，不再用 setup-android 动作：
      # 那个动作会去装已经下架的 tools 包，必然失败。
      - name: 安装 NDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "ndk;26.1.10909125"
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: 安装 cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: 构建前端
        working-directory: web
        env:
          VITE_API_BASE: ${{ vars.ANDROID_API_BASE }}
        run: |
          set -euo pipefail
          if [ -z "${VITE_API_BASE:-}" ]; then
            echo "缺少仓库变量 ANDROID_API_BASE，App 的接口会打到本地，装上去也没法用"
            exit 1
          fi
          echo "后端地址: $VITE_API_BASE"
          pnpm install --frozen-lockfile
          pnpm build

          # 确认地址真的被打进了产物，而不只是设了环境变量
          if ! grep -rq "$VITE_API_BASE" dist; then
            echo "产物里没有找到后端地址，构建没有生效"
            exit 1
          fi
          echo "产物已包含后端地址"

      # services.gradle.org 经常 504，把分发和依赖缓存下来，命中就不必再拉
      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('src-tauri/**/*.gradle*') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 安装 Tauri CLI
        run: pnpm install --no-frozen-lockfile

      # 用仓库里的源图重新生成全套图标（含安卓各密度），保证和设计稿一致
      - name: 生成图标
        run: pnpm tauri icon src-tauri/icon-source.png

      - name: 初始化安卓工程
        run: pnpm tauri android init --ci

      # tauri icon 只把安卓图标生成到 icons/android，init 不会自动拷进工程，这里显式覆盖
      - name: 应用安卓图标
        run: |
          set -euo pipefail
          RES="src-tauri/gen/android/app/src/main/res"
          SRC="src-tauri/icons/android"
          test -d "$SRC" || { echo "缺少 $SRC"; exit 1; }

          groups=0
          for d in "$SRC"/mipmap-*; do
            name=$(basename "$d")
            mkdir -p "$RES/$name"
            cp -f "$d"/*.png "$RES/$name"/
            groups=$((groups + 1))
          done
          echo "覆盖了 $groups 组密度"
          ls -l "$RES"/mipmap-xxhdpi

          # 自适应图标的底色换成品牌色，系统做视差时不会露出白底
          COLORS="$RES/values/colors.xml"
          if [ -f "$COLORS" ]; then
            python3 - "$COLORS" <<'PY'
          import re, sys
          path = sys.argv[1]
          text = open(path, encoding="utf-8").read()
          new, n = re.subn(r'(<color name="ic_launcher_background">)[^<]*(</color>)',
                           r"\g<1>#4F63EA\g<2>", text)
          if n == 0:
              new = text.replace("</resources>",
                  '    <color name="ic_launcher_background">#4F63EA</color>\n</resources>')
          open(path, "w", encoding="utf-8").write(new)
          print("背景色已设为品牌色")
          PY
          fi

      # 装到手机上的名字改成中文
      - name: 改应用名
        run: |
          set -euo pipefail
          F="src-tauri/gen/android/app/src/main/res/values/strings.xml"
          if [ ! -f "$F" ]; then echo "没找到 strings.xml"; exit 1; fi
          python3 - "$F" <<'PY'
          import re, sys
          path = sys.argv[1]
          text = open(path, encoding="utf-8").read()
          new, n = re.subn(r"<string name=\"app_name\">.*?</string>",
                           "<string name=\"app_name\">图嘟嘟</string>", text)
          if n == 0:
              sys.exit("strings.xml 里没有 app_name")
          open(path, "w", encoding="utf-8").write(new)
          print(new)
          PY

      # Maven Central 偶尔把大 jar 重定向到 GitHub release，那条路径在 runner 上一直 504。
      # 同时挂上国内镜像兜底，命中一个就能继续。
      - name: 配置 Maven 镜像
        run: |
          mkdir -p "$HOME/.gradle"
          cat > "$HOME/.gradle/init.gradle" <<'EOF'
          allprojects {
            buildscript {
              repositories {
                maven { url "https://maven.aliyun.com/repository/public" }
                maven { url "https://maven.aliyun.com/repository/google" }
                maven { url "https://maven.aliyun.com/repository/gradle-plugin" }
              }
            }
            repositories {
              maven { url "https://maven.aliyun.com/repository/public" }
              maven { url "https://maven.aliyun.com/repository/google" }
            }
          }

          settingsEvaluated { settings ->
            settings.pluginManagement {
              repositories {
                maven { url "https://maven.aliyun.com/repository/gradle-plugin" }
                maven { url "https://maven.aliyun.com/repository/public" }
              }
            }
          }
          EOF
          cat "$HOME/.gradle/init.gradle"

      # services.gradle.org 走 CDN，runner 拉大文件经常 504。
      # 先用 curl 多源重试把分发包拿到本地，再让 wrapper 读 file://，彻底绕开下载。
      - name: 预下载 Gradle 分发包
        run: |
          set -euo pipefail
          WRAPPER=$(find src-tauri/gen/android -name gradle-wrapper.properties | head -1)
          VERSION=$(grep -oE "gradle-[0-9.]+-bin\.zip" "$WRAPPER" | head -1 | sed -E "s/gradle-(.*)-bin\.zip/\1/")
          ZIP="$RUNNER_TEMP/gradle-$VERSION-bin.zip"
          echo "gradle: $VERSION -> $ZIP"

          URLS=(
            "https://services.gradle.org/distributions/gradle-$VERSION-bin.zip"
            "https://downloads.gradle.org/distributions/gradle-$VERSION-bin.zip"
            "https://mirrors.cloud.tencent.com/gradle/gradle-$VERSION-bin.zip"
            "https://mirrors.aliyun.com/macports/distfiles/gradle/gradle-$VERSION-bin.zip"
          )

          ok=0
          for url in "${URLS[@]}"; do
            echo "尝试 $url"
            if curl -fL --retry 6 --retry-delay 4 --retry-all-errors --connect-timeout 20 -o "$ZIP" "$url"; then
              ok=1
              break
            fi
            rm -f "$ZIP"
          done
          test "$ok" = "1" || { echo "所有 Gradle 分发源都失败"; exit 1; }
          ls -lh "$ZIP"

          # properties 里的冒号是转义过的，直接整行重写指向本地文件
          {
            grep -v "^distributionUrl=" "$WRAPPER" || true
            printf "distributionUrl=file\\://%s\n" "$ZIP"
            printf "networkTimeout=60000\n"
          } > "$WRAPPER.new"
          mv "$WRAPPER.new" "$WRAPPER"
          cat "$WRAPPER"

      - name: 打包 APK
        run: pnpm tauri android build --apk --target aarch64

      - name: 签名并整理产物
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail

          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

          UNSIGNED=$(find src-tauri/gen/android -name '*-release-unsigned.apk' | head -1)
          if [ -z "$UNSIGNED" ]; then
            echo "没有找到未签名的 APK"
            find src-tauri/gen/android -name '*.apk'
            exit 1
          fi

          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"

          mkdir -p dist
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$STORE_PASS" \
            --key-pass "pass:$KEY_PASS" \
            --out dist/tududu.apk \
            "$RUNNER_TEMP/aligned.apk"

          "$BUILD_TOOLS/apksigner" verify --print-certs dist/tududu.apk | head -5
          ls -lh dist/tududu.apk

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: tududu-android
          path: dist/tududu.apk
          if-no-files-found: error

  web:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 安装依赖
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: 类型检查
        working-directory: web
        run: pnpm typecheck
      - name: 构建静态站点
        working-directory: web
        run: pnpm build
      - name: 上传锁文件
        uses: actions/upload-artifact@v4
        with:
          name: web-lockfile
          path: web/pnpm-lock.yaml
          if-no-files-found: warn

  admin:
    name: 管理后台构建
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 安装依赖
        working-directory: admin
        run: pnpm install --frozen-lockfile
      - name: 类型检查
        working-directory: admin
        run: pnpm typecheck
      - name: 构建静态站点
        working-directory: admin
        run: |
          set -euo pipefail
          pnpm build

          if ! grep -q '/admin/assets/' dist/index.html; then
            echo "管理后台的产物没有带 /admin 前缀，打开会是白屏"
            cat dist/index.html
            exit 1
          fi
      - name: 上传锁文件
        uses: actions/upload-artifact@v4
        with:
          name: admin-lockfile
          path: admin/pnpm-lock.yaml
          if-no-files-found: warn

  summary:
    name: 汇总
    runs-on: ubuntu-latest
    needs: [fmt, clippy, test, integration, build, web, admin, android]
    if: always()
    steps:
      - name: 写运行摘要
        env:
          R_FMT: ${{ needs.fmt.result }}
          R_CLIPPY: ${{ needs.clippy.result }}
          R_TEST: ${{ needs.test.result }}
          R_BUILD: ${{ needs.build.result }}
          R_INT: ${{ needs.integration.result }}
          R_WEB: ${{ needs.web.result }}
          R_ADMIN: ${{ needs.admin.result }}
          R_ANDROID: ${{ needs.android.result }}
        run: |
          {
            echo "## 流水线结果"
            echo ""
            echo "| 任务 | 结果 |"
            echo "| --- | --- |"
            echo "| 格式检查 | ${R_FMT} |"
            echo "| 静态检查 | ${R_CLIPPY} |"
            echo "| 单元测试 | ${R_TEST} |"
            echo "| 集成测试 | ${R_INT} |"
            echo "| 构建静态二进制 | ${R_BUILD} |"
            echo "| 前端构建 | ${R_WEB} |"
            echo "| 管理后台构建 | ${R_ADMIN} |"
            echo "| 安卓打包 | ${R_ANDROID} |"
          } >> "$GITHUB_STEP_SUMMARY"